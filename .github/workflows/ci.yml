name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build e testes (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restaurar
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Testes (unidade e integração)
        run: dotnet test --no-build -c Release --logger trx --results-directory resultados
      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: resultados
