# Blueprint do Render (https://render.com/docs/blueprint-spec)
# Hospedagem pública da API de telemetria para o app Mobile e para a correção (até 30/11).
# Valores com sync: false são preenchidos no painel do Render (nunca no Git).
services:
  - type: web
    name: ressoa-api-dotnet
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./dockerfiles/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: ConnectionStrings__Oracle
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: Servicos__ApiJavaHealthUrl
        value: https://ressoa-api-java.onrender.com/actuator/health/liveness
